# Nordic Work Intelligence — nginx konfiguratsiyasi.
# Faqat HTTP: HTTPS'ni asosiy serverdagi Kerio Control proksi-serveri boshqaradi.
#
# O'rnatish:
#   sudo cp infra/nginx/work-intelligence.nordicun.uz.conf /etc/nginx/sites-available/work-intelligence.nordicun.uz
#   sudo ln -s /etc/nginx/sites-available/work-intelligence.nordicun.uz /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# "/OPT/WORK-INTELLIGENCE" o'rniga loyiha papkasining haqiqiy yo'lini yozing.
server {
    listen 80;
    server_name work-intelligence.nordicun.uz;

    # Hujjat va ekran tasviri yuklash uchun.
    client_max_body_size 30m;

    # Admin panel (statik fayllar).
    root /OPT/WORK-INTELLIGENCE/apps/admin/dist;
    index index.html;

    # API so'rovlari Node xizmatiga (port 5084) uzatiladi.
    location /api/ {
        proxy_pass http://127.0.0.1:5084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tashqi ulanish Kerio orqali HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Qolgan barcha yo'llar — bitta sahifali ilova.
    location / {
        try_files $uri /index.html;
    }
}
